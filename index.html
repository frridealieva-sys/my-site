<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Страница обо мне</title>
  <style>
    body {
      margin: 0;
      padding: 20px 10px;
      background: #faf7ff;
      font-family: Arial, sans-serif;
    }
    #main {
      width: 710px;
      max-width: 100%;
      margin: 0 auto;
      border: 3px solid #edc7ff;
      box-sizing: border-box;
      background: white;
    }
    #header {
      height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 3px solid #fff7c7;
      font-size: 28px;
      font-weight: bold;
      color: #7c3aed;
    }
    #photo {
      width: 450px;
      max-width: 60%;
      height: 500px;
      float: left;
      border-right: 3px solid #fff7c7;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: #f4f0ff;
      box-sizing: border-box;
    }
    #photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    #text {
      width: 255px;
      max-width: 40%;
      height: 500px;
      float: right;
      text-indent: 20px;
      display: flex;
      align-items: flex-end;
      padding: 15px;
      box-sizing: border-box;
      font-size: 17px;
      color: #333;
      line-height: 1.5;
    }
    #footer {
      height: 25px;
      display: flex;
      align-items: center;
      justify-content: center;
      clear: both;
      border-top: 3px solid #fff7c7;
      font-size: 15px;
      color: #7c3aed;
      padding: 10px;
    }
    #footer a {
      color: #7c3aed;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div id="main">
    <div id="header">Приветствие</div>
    <div id="photo">
      <img src="7dYm4k6dX0s-3.jpg" alt="Моё фото">
    </div>
    <div id="text">Фериде, 15 лет, Стальновская школа</div>
    <div id="footer">
      <a href="tel:+79787747011">+7 978 774-70-11</a>
    </div>
  </div>
</body>
</html>
