<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Обо мне</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f4f8;
      text-align: center;
      padding: 40px 20px;
      margin: 0;
    }
    h1 { color: #2c3e50; font-size: 32px; }
    p { color: #555; font-size: 18px; line-height: 1.6; }
    .card {
      background: white;
      border-radius: 16px;
      padding: 30px 20px;
      max-width: 500px;
      margin: 0 auto;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }
    .info {
      text-align: left;
      margin-top: 20px;
    }
    .info p {
      margin: 10px 0;
    }
    .label {
      font-weight: bold;
      color: #2c3e50;
    }
    .menu { margin-bottom: 20px; }
    .menu a {
      display: inline-block;
      margin: 5px;
      padding: 8px 16px;
      background: #e2e8f0;
      color: #2c3e50;
      text-decoration: none;
      border-radius: 8px;
      font-size: 15px;
    }
    .menu a.active {
      background: #2c3e50;
      color: white;
    }
  </style>
</head>
<body>
  <div class="menu">
    <a href="index.html">Главная</a>
    <a href="about.html" class="active">Обо мне</a>
  </div>

  <div class="card">
    <h1>Обо мне</h1>
    <div class="info">
      <p><span class="label">Имя:</span> Фериде</p>
      <p><span class="label">Возраст:</span> 14 лет</p>
      <p><span class="label">Школа:</span> Стальновская школа</p>
    </div>
  </div>
</body>
</html>
